<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260">
  <defs>
    <!-- Background Gradient: Velvet Cherry Dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080205" />
      <stop offset="100%" stop-color="#180610" />
    </linearGradient>

    <!-- Cherry Glow Filter -->
    <filter id="glowCherry" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Rose Glow Filter -->
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Global Styles */
    .bg { fill: url(#bgGrad); }
    .grid { stroke: #3A1024; stroke-width: 0.5; opacity: 0.25; }
    
    /* Keyframe Animations */
    @keyframes gridPulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.45; }
    }
    .grid-lines {
      animation: gridPulse 4s ease-in-out infinite;
    }

    @keyframes laserScan {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { transform: translateY(260px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.2; }
    }
    .laser {
      stroke: #FF4B72;
      stroke-width: 1.5;
      filter: url(#glowCherry);
      animation: laserScan 6s ease-in-out infinite;
    }

    @keyframes textGlow {
      0%, 100% { fill: #ffffff; filter: drop-shadow(0 0 2px #FF4B72); }
      50% { fill: #FF4B72; filter: drop-shadow(0 0 12px #FF4B72) drop-shadow(0 0 20px #D11A5B); }
    }
    .main-title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: 6px;
      fill: #ffffff;
      animation: textGlow 5s ease-in-out infinite;
    }

    @keyframes subtitlePulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; fill: #FF8DA1; filter: drop-shadow(0 0 3px #FF8DA1); }
    }
    .sub-title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 4px;
      fill: #94A3B8;
      animation: subtitlePulse 3s ease-in-out infinite;
    }

    @keyframes circuitFlow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .circuit-path {
      stroke-dasharray: 20 80;
      animation: circuitFlow 4s linear infinite;
    }

    @keyframes rotGears {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .gear {
      transform-origin: 750px 70px;
      animation: rotGears 20s linear infinite;
    }
    .gear-slow {
      transform-origin: 70px 180px;
      animation: rotGears 30s linear infinite reverse;
    }
  </style>

  <!-- Background -->
  <rect width="820" height="260" class="bg" />

  <!-- Animated Grid Background -->
  <g class="grid-lines">
    <!-- Horizontal lines -->
    <line x1="0" y1="40" x2="820" y2="40" class="grid" />
    <line x1="0" y1="80" x2="820" y2="80" class="grid" />
    <line x1="0" y1="120" x2="820" y2="120" class="grid" />
    <line x1="0" y1="160" x2="820" y2="160" class="grid" />
    <line x1="0" y1="200" x2="820" y2="200" class="grid" />
    <line x1="0" y1="240" x2="820" y2="240" class="grid" />

    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="260" class="grid" />
    <line x1="200" y1="0" x2="200" y2="260" class="grid" />
    <line x1="300" y1="0" x2="300" y2="260" class="grid" />
    <line x1="400" y1="0" x2="400" y2="260" class="grid" />
    <line x1="500" y1="0" x2="500" y2="260" class="grid" />
    <line x1="600" y1="0" x2="600" y2="260" class="grid" />
    <line x1="700" y1="0" x2="700" y2="260" class="grid" />
  </g>

  <!-- High Tech Gear Visuals -->
  <g stroke="#FF4B72" stroke-width="1.5" fill="none" opacity="0.3">
    <!-- Top Right Gear -->
    <circle cx="750" cy="70" r="30" class="gear" stroke-dasharray="8 6" />
    <circle cx="750" cy="70" r="15" />
    
    <!-- Bottom Left Gear -->
    <circle cx="70" cy="180" r="40" class="gear-slow" stroke-dasharray="10 8" stroke="#FF8DA1" />
    <circle cx="70" cy="180" r="20" stroke="#FF8DA1" />
  </g>

  <!-- Abstract Tech Circuits -->
  <g fill="none" opacity="0.6">
    <!-- Cherry Line -->
    <path d="M 150 50 L 300 50 L 330 80 L 600 80" stroke="#FF4B72" stroke-width="1.2" />
    <path d="M 150 50 L 300 50 L 330 80 L 600 80" stroke="#D11A5B" stroke-width="1.5" class="circuit-path" />
    <circle cx="150" cy="50" r="3" fill="#FF4B72" />
    <circle cx="600" cy="80" r="3" fill="#FF4B72" />

    <!-- Rose Line -->
    <path d="M 680 210 L 500 210 L 460 170 L 200 170" stroke="#D11A5B" stroke-width="1.2" />
    <path d="M 680 210 L 500 210 L 460 170 L 200 170" stroke="#FF4B72" stroke-width="1.5" class="circuit-path" />
    <circle cx="680" cy="210" r="3" fill="#D11A5B" />
    <circle cx="200" cy="170" r="3" fill="#D11A5B" />
  </g>

  <!-- Main Title Text -->
  <text x="50%" y="125" text-anchor="middle" class="main-title">ALLAN ABRAHAM</text>

  <!-- Subtitle Text -->
  <text x="50%" y="165" text-anchor="middle" class="sub-title">AI • CLOUD • DEVOPS • EMBEDDED SYSTEMS</text>

  <!-- Animated Laser Scanning Line -->
  <line x1="0" y1="0" x2="820" y2="0" class="laser" />
</svg>
