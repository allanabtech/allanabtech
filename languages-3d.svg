<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <style>
    .bg { fill: #0D080B; rx: 12px; }
    .title-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #FF4B72; letter-spacing: 1px; }
    .legend-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #E2E8F0; }
    .legend-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94A3B8; font-weight: 500; }
    .legend-pct { font-family: 'Fira Code', monospace; font-size: 11px; fill: #FF8DA1; font-weight: 600; }
    .donut-center { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #E2E8F0; }
    
    @keyframes spinDonut {
      from { transform: rotate(-10deg); opacity: 0; }
      to { transform: rotate(0deg); opacity: 1; }
    }
    .donut-group {
      transform-origin: 200px 145px;
      animation: spinDonut 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style>

  <!-- Background -->
  <rect width="600" height="280" class="bg" />

  <text x="30" y="35" class="title-text">GITHUB LANGUAGE METRICS</text>

  <g class="donut-group">
    <!-- Outer wall for TypeScript -->
    <path d="M 200.0,80.0 A 110,60 0 0,1 228.2,198.0 L 228.2,213.0 A 110,60 0 0,0 200.0,95.0 Z" fill="#6D28D9" />
    <!-- Inner wall for TypeScript -->
    <path d="M 200.0,110.0 A 55,30 0 0,1 214.1,169.0 L 214.1,184.0 A 55,30 0 0,0 200.0,125.0 Z" fill="#6D28D9" opacity="0.6" />
    <!-- Outer wall for Python -->
    <path d="M 228.2,198.0 A 110,60 0 0,1 102.5,112.2 L 102.5,127.2 A 110,60 0 0,0 228.2,213.0 Z" fill="#1E9D7A" />
    <!-- Inner wall for Python -->
    <path d="M 214.1,169.0 A 55,30 0 0,1 151.3,126.1 L 151.3,141.1 A 55,30 0 0,0 214.1,184.0 Z" fill="#1E9D7A" opacity="0.6" />
    <!-- Outer wall for Java -->
    <path d="M 102.5,112.2 A 110,60 0 0,1 152.6,85.8 L 152.6,100.8 A 110,60 0 0,0 102.5,127.2 Z" fill="#C2410C" />
    <!-- Inner wall for Java -->
    <path d="M 151.3,126.1 A 55,30 0 0,1 176.3,112.9 L 176.3,127.9 A 55,30 0 0,0 151.3,141.1 Z" fill="#C2410C" opacity="0.6" />
    <!-- Outer wall for HTML -->
    <path d="M 152.6,85.8 A 110,60 0 0,1 188.2,80.3 L 188.2,95.3 A 110,60 0 0,0 152.6,100.8 Z" fill="#C72246" />
    <!-- Inner wall for HTML -->
    <path d="M 176.3,112.9 A 55,30 0 0,1 194.1,110.2 L 194.1,125.2 A 55,30 0 0,0 176.3,127.9 Z" fill="#C72246" opacity="0.6" />
    <!-- Outer wall for CSS -->
    <path d="M 188.2,80.3 A 110,60 0 0,1 198.6,80.0 L 198.6,95.0 A 110,60 0 0,0 188.2,95.3 Z" fill="#0369A1" />
    <!-- Inner wall for CSS -->
    <path d="M 194.1,110.2 A 55,30 0 0,1 199.3,110.0 L 199.3,125.0 A 55,30 0 0,0 194.1,125.2 Z" fill="#0369A1" opacity="0.6" />
    <!-- Top face for TypeScript -->
    <path d="M 200.0,80.0 A 110,60 0 0,1 228.2,198.0 L 214.1,169.0 A 55,30 0 0,0 200.0,110.0 Z" fill="#C084FC" stroke="#A78BFA" stroke-width="0.5" />
    <!-- Top face for Python -->
    <path d="M 228.2,198.0 A 110,60 0 0,1 102.5,112.2 L 151.3,126.1 A 55,30 0 0,0 214.1,169.0 Z" fill="#4DF5C9" stroke="#35E2B5" stroke-width="0.5" />
    <!-- Top face for Java -->
    <path d="M 102.5,112.2 A 110,60 0 0,1 152.6,85.8 L 176.3,112.9 A 55,30 0 0,0 151.3,126.1 Z" fill="#FDBA74" stroke="#FB923C" stroke-width="0.5" />
    <!-- Top face for HTML -->
    <path d="M 152.6,85.8 A 110,60 0 0,1 188.2,80.3 L 194.1,110.2 A 55,30 0 0,0 176.3,112.9 Z" fill="#FF7392" stroke="#FF4B72" stroke-width="0.5" />
    <!-- Top face for CSS -->
    <path d="M 188.2,80.3 A 110,60 0 0,1 198.6,80.0 L 199.3,110.0 A 55,30 0 0,0 194.1,110.2 Z" fill="#7DD3FC" stroke="#38BDF8" stroke-width="0.5" />
  </g>

  <!-- Legend Section on the Right -->
  <g transform="translate(390, 60)">
    <text x="0" y="0" class="legend-title">LANGUAGES</text>
    <!-- Legend Item 1: TypeScript -->
    <rect x="0" y="14" width="12" height="12" rx="3" fill="#A78BFA" />
    <text x="22" y="0" class="legend-text" transform="translate(0, 24)">
      TypeScript <tspan class="legend-pct">  45.9%</tspan>
    </text>
    <!-- Legend Item 2: Python -->
    <rect x="0" y="44" width="12" height="12" rx="3" fill="#35E2B5" />
    <text x="22" y="0" class="legend-text" transform="translate(0, 54)">
      Python <tspan class="legend-pct">  36.8%</tspan>
    </text>
    <!-- Legend Item 3: Java -->
    <rect x="0" y="74" width="12" height="12" rx="3" fill="#FB923C" />
    <text x="22" y="0" class="legend-text" transform="translate(0, 84)">
      Java <tspan class="legend-pct">  10.2%</tspan>
    </text>
    <!-- Legend Item 4: HTML -->
    <rect x="0" y="104" width="12" height="12" rx="3" fill="#FF4B72" />
    <text x="22" y="0" class="legend-text" transform="translate(0, 114)">
      HTML <tspan class="legend-pct">  5.4%</tspan>
    </text>
    <!-- Legend Item 5: CSS -->
    <rect x="0" y="134" width="12" height="12" rx="3" fill="#38BDF8" />
    <text x="22" y="0" class="legend-text" transform="translate(0, 144)">
      CSS <tspan class="legend-pct">  1.5%</tspan>
    </text>
  </g>
</svg>
