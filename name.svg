<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 60" width="500" height="60">
  <style>
    @keyframes colorPulse {
      0%, 100% { 
        fill: #FF4B72; 
        filter: drop-shadow(0 0 2px rgba(255, 75, 114, 0.6)); 
      }
      50% { 
        fill: #FF8DA1; 
        filter: drop-shadow(0 0 10px rgba(255, 75, 114, 0.9)) drop-shadow(0 0 18px rgba(209, 26, 91, 0.75)); 
      }
    }
    .text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 32px;
      letter-spacing: 4px;
      text-anchor: middle;
      animation: colorPulse 3s ease-in-out infinite;
    }
  </style>
  <text x="50%" y="42" class="text">ALLAN ABRAHAM</text>
</svg>
