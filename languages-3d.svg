<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <style>
    .bg { fill: #0D080B; rx: 12px; }
    .title-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #FF4B72; letter-spacing: 1px; }
    .legend-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #E2E8F0; }
    .legend-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94A3B8; font-weight: 500; }
    .legend-pct { font-family: 'Fira Code', monospace; font-size: 11px; fill: #FF8DA1; font-weight: 600; }
    
    @keyframes spinDonut {
      from { transform: rotate(-10deg); opacity: 0; }
      to { transform: rotate(0deg); opacity: 1; }
    }
    .donut-group {
      transform-origin: 200px 140px;
      animation: spinDonut 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style>

  <!-- Background -->
  <rect width="600" height="280" class="bg" />

  <text x="30" y="35" class="title-text">GITHUB LANGUAGE METRICS</text>

  <g class="donut-group">
    <!-- Outer wall for TypeScript -->
    <path d="M 200.0,80.0 A 110,60 0 1,1 120.2,181.3 L 120.2,196.3 A 110,60 0 1,0 200.0,95.0 Z" fill="#6D28D9" />
    <!-- Inner wall for TypeScript -->
    <path d="M 200.0,110.0 A 55,30 0 1,1 160.1,160.6 L 160.1,175.6 A 55,30 0 1,0 200.0,125.0 Z" fill="#6D28D9" opacity="0.6" />
    
    <!-- Outer wall for Java -->
    <path d="M 120.2,181.3 A 110,60 0 0,1 93.5,124.9 L 93.5,139.9 A 110,60 0 0,0 120.2,196.3 Z" fill="#C2410C" />
    <!-- Inner wall for Java -->
    <path d="M 160.1,160.6 A 55,30 0 0,1 146.8,132.4 L 146.8,147.4 A 55,30 0 0,0 160.1,175.6 Z" fill="#C2410C" opacity="0.6" />
    
    <!-- Outer wall for Python -->
    <path d="M 93.5,124.9 A 110,60 0 0,1 133.6,92.2 L 133.6,107.2 A 110,60 0 0,0 93.5,139.9 Z" fill="#1E9D7A" />
    <!-- Inner wall for Python -->
    <path d="M 146.8,132.4 A 55,30 0 0,1 166.8,116.1 L 166.8,131.1 A 55,30 0 0,0 146.8,147.4 Z" fill="#1E9D7A" opacity="0.6" />
    
    <!-- Outer wall for HTML -->
    <path d="M 133.6,92.2 A 110,60 0 0,1 186.2,80.5 L 186.2,95.5 A 110,60 0 0,0 133.6,107.2 Z" fill="#C72246" />
    <!-- Inner wall for HTML -->
    <path d="M 166.8,116.1 A 55,30 0 0,1 193.1,110.2 L 193.1,125.2 A 55,30 0 0,0 166.8,131.1 Z" fill="#C72246" opacity="0.6" />
    
    <!-- Outer wall for CSS -->
    <path d="M 186.2,80.5 A 110,60 0 0,1 200.0,80.0 L 200.0,95.0 A 110,60 0 0,0 186.2,95.5 Z" fill="#0369A1" />
    <!-- Inner wall for CSS -->
    <path d="M 193.1,110.2 A 55,30 0 0,1 200.0,110.0 L 200.0,125.0 A 55,30 0 0,0 193.1,125.2 Z" fill="#0369A1" opacity="0.6" />

    <!-- Top face for TypeScript -->
    <path d="M 200.0,80.0 A 110,60 0 1,1 120.2,181.3 L 160.1,160.6 A 55,30 0 1,0 200.0,110.0 Z" fill="#C084FC" stroke="#A78BFA" stroke-width="0.5" />
    
    <!-- Top face for Java -->
    <path d="M 120.2,181.3 A 110,60 0 0,1 93.5,124.9 L 146.8,132.4 A 55,30 0 0,0 160.1,160.6 Z" fill="#FDBA74" stroke="#FB923C" stroke-width="0.5" />
    
    <!-- Top face for Python -->
    <path d="M 93.5,124.9 A 110,60 0 0,1 133.6,92.2 L 166.8,116.1 A 55,30 0 0,0 146.8,132.4 Z" fill="#4DF5C9" stroke="#35E2B5" stroke-width="0.5" />
    
    <!-- Top face for HTML -->
    <path d="M 133.6,92.2 A 110,60 0 0,1 186.2,80.5 L 193.1,110.2 A 55,30 0 0,0 166.8,116.1 Z" fill="#FF7392" stroke="#FF4B72" stroke-width="0.5" />
    
    <!-- Top face for CSS -->
    <path d="M 186.2,80.5 A 110,60 0 0,1 200.0,80.0 L 200.0,110.0 A 55,30 0 0,0 193.1,110.2 Z" fill="#7DD3FC" stroke="#38BDF8" stroke-width="0.5" />
  </g>

  <!-- Legend Section on the Right -->
  <g transform="translate(390, 60)">
    <text x="0" y="0" class="legend-title">LANGUAGES</text>
    
    <!-- Legend Item 1: TypeScript -->
    <rect x="0" y="14" width="12" height="12" rx="3" fill="#A78BFA" />
    <text x="22" y="24" class="legend-text">
      TypeScript <tspan class="legend-pct">  62.9%</tspan>
    </text>
    
    <!-- Legend Item 2: Java -->
    <rect x="0" y="44" width="12" height="12" rx="3" fill="#FB923C" />
    <text x="22" y="54" class="legend-text">
      Java <tspan class="legend-pct">  16.0%</tspan>
    </text>
    
    <!-- Legend Item 3: Python -->
    <rect x="0" y="74" width="12" height="12" rx="3" fill="#35E2B5" />
    <text x="22" y="84" class="legend-text">
      Python <tspan class="legend-pct">  10.5%</tspan>
    </text>
    
    <!-- Legend Item 4: HTML -->
    <rect x="0" y="104" width="12" height="12" rx="3" fill="#FF4B72" />
    <text x="22" y="114" class="legend-text">
      HTML <tspan class="legend-pct">  8.3%</tspan>
    </text>
    
    <!-- Legend Item 5: CSS -->
    <rect x="0" y="134" width="12" height="12" rx="3" fill="#38BDF8" />
    <text x="22" y="144" class="legend-text">
      CSS <tspan class="legend-pct">  2.3%</tspan>
    </text>
  </g>
</svg>
