<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <style>
    .bg { fill: #0D080B; rx: 12px; }
    .title-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #FF4B72; letter-spacing: 1px; }
    .legend-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #E2E8F0; }
    .legend-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94A3B8; font-weight: 500; }
    .legend-pct { font-family: 'Fira Code', monospace; font-size: 11px; fill: #FF8DA1; font-weight: 600; }
    .donut-center { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #E2E8F0; }
    
    @keyframes spinDonut {
      from { transform: rotate(-10deg); opacity: 0; }
      to { transform: rotate(0deg); opacity: 1; }
    }
    .donut-group {
      transform-origin: 200px 145px;
      animation: spinDonut 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style>

  <!-- Background -->
  <rect width="600" height="280" class="bg" />

  <text x="30" y="35" class="title-text">GITHUB LANGUAGE METRICS</text>

  <g class="donut-group">
    <!-- Outer wall for TypeScript -->
    <path d="M 200.0,80.0 A 110,60 0 0,1 225.3,198.4 L 225.3,213.4 A 110,60 0 0,0 200.0,95.0 Z" fill="#6D28D9" />
    <!-- Inner wall for TypeScript -->
    <path d="M 200.0,110.0 A 55,30 0 0,1 212.6,169.2 L 212.6,184.2 A 55,30 0 0,0 200.0,125.0 Z" fill="#6D28D9" opacity="0.6" />
    <!-- Outer wall for Python -->
    <path d="M 225.3,198.4 A 110,60 0 0,1 96.8,119.2 L 96.8,134.2 A 110,60 0 0,0 225.3,213.4 Z" fill="#1E9D7A" />
    <!-- Inner wall for Python -->
    <path d="M 212.6,169.2 A 55,30 0 0,1 148.4,129.6 L 148.4,144.6 A 55,30 0 0,0 212.6,184.2 Z" fill="#1E9D7A" opacity="0.6" />
    <!-- Outer wall for Java -->
    <path d="M 96.8,119.2 A 110,60 0 0,1 136.1,91.2 L 136.1,106.2 A 110,60 0 0,0 96.8,134.2 Z" fill="#C2410C" />
    <!-- Inner wall for Java -->
    <path d="M 148.4,129.6 A 55,30 0 0,1 168.0,115.6 L 168.0,130.6 A 55,30 0 0,0 148.4,144.6 Z" fill="#C2410C" opacity="0.6" />
    <!-- Outer wall for HTML -->
    <path d="M 136.1,91.2 A 110,60 0 0,1 167.2,82.7 L 167.2,97.7 A 110,60 0 0,0 136.1,106.2 Z" fill="#C72246" />
    <!-- Inner wall for HTML -->
    <path d="M 168.0,115.6 A 55,30 0 0,1 183.6,111.4 L 183.6,126.4 A 55,30 0 0,0 168.0,130.6 Z" fill="#C72246" opacity="0.6" />
    <!-- Outer wall for Rust -->
    <path d="M 167.2,82.7 A 110,60 0 0,1 185.7,80.5 L 185.7,95.5 A 110,60 0 0,0 167.2,97.7 Z" fill="#475569" />
    <!-- Inner wall for Rust -->
    <path d="M 183.6,111.4 A 55,30 0 0,1 192.9,110.3 L 192.9,125.3 A 55,30 0 0,0 183.6,126.4 Z" fill="#475569" opacity="0.6" />
    <!-- Top face for TypeScript -->
    <path d="M 200.0,80.0 A 110,60 0 0,1 225.3,198.4 L 212.6,169.2 A 55,30 0 0,0 200.0,110.0 Z" fill="#C084FC" stroke="#A78BFA" stroke-width="0.5" />
    <!-- Top face for Python -->
    <path d="M 225.3,198.4 A 110,60 0 0,1 96.8,119.2 L 148.4,129.6 A 55,30 0 0,0 212.6,169.2 Z" fill="#4DF5C9" stroke="#35E2B5" stroke-width="0.5" />
    <!-- Top face for Java -->
    <path d="M 96.8,119.2 A 110,60 0 0,1 136.1,91.2 L 168.0,115.6 A 55,30 0 0,0 148.4,129.6 Z" fill="#FDBA74" stroke="#FB923C" stroke-width="0.5" />
    <!-- Top face for HTML -->
    <path d="M 136.1,91.2 A 110,60 0 0,1 167.2,82.7 L 183.6,111.4 A 55,30 0 0,0 168.0,115.6 Z" fill="#FF7392" stroke="#FF4B72" stroke-width="0.5" />
    <!-- Top face for Rust -->
    <path d="M 167.2,82.7 A 110,60 0 0,1 185.7,80.5 L 192.9,110.3 A 55,30 0 0,0 183.6,111.4 Z" fill="#CBD5E1" stroke="#94A3B8" stroke-width="0.5" />
  </g>

  <!-- Legend Section on the Right -->
  <g transform="translate(390, 60)">
    <text x="0" y="0" class="legend-title">LANGUAGES</text>
    <!-- Legend Item 1: TypeScript -->
    <rect x="0" y="14" width="12" height="12" rx="3" fill="#A78BFA" />
    <text x="22" y="0" class="legend-text" transform="translate(0, 24)">
      TypeScript <tspan class="legend-pct">  46.3%</tspan>
    </text>
    <!-- Legend Item 2: Python -->
    <rect x="0" y="44" width="12" height="12" rx="3" fill="#35E2B5" />
    <text x="22" y="0" class="legend-text" transform="translate(0, 54)">
      Python <tspan class="legend-pct">  34.3%</tspan>
    </text>
    <!-- Legend Item 3: Java -->
    <rect x="0" y="74" width="12" height="12" rx="3" fill="#FB923C" />
    <text x="22" y="0" class="legend-text" transform="translate(0, 84)">
      Java <tspan class="legend-pct">  9.5%</tspan>
    </text>
    <!-- Legend Item 4: HTML -->
    <rect x="0" y="104" width="12" height="12" rx="3" fill="#FF4B72" />
    <text x="22" y="0" class="legend-text" transform="translate(0, 114)">
      HTML <tspan class="legend-pct">  5.0%</tspan>
    </text>
    <!-- Legend Item 5: Rust -->
    <rect x="0" y="134" width="12" height="12" rx="3" fill="#94A3B8" />
    <text x="22" y="0" class="legend-text" transform="translate(0, 144)">
      Rust <tspan class="legend-pct">  2.8%</tspan>
    </text>
  </g>
</svg>
