name: Generate Snake and Update Stats

on:
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight UTC
  workflow_dispatch: # allows manual trigger

jobs:
  generate:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 60



    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=green&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-snake-dark.svg?palette=github-dark&color_snake=green&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Update Contribution Streak Stats in README
        run: |
          python -c '
          import urllib.request
          import json
          import re
          
          url = "https://streak-stats.demolab.com/?user=allanabtech&type=json"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  total = data.get("totalContributions", 0)
                  current = data.get("currentStreak", {}).get("length", 0)
                  longest = data.get("longestStreak", {}).get("length", 0)
                  
                  replacement = f"**Total Contributions: {total} &nbsp;·&nbsp; Current Streak: {current} &nbsp;·&nbsp; Longest Streak: {longest}**"
                  
                  with open("README.md", "r", encoding="utf-8") as f:
                      content = f.read()
                      
                  new_content = re.sub(
                      r"(<!-- STREAK_LINE_START -->\n).*?(\n<!-- STREAK_LINE_END -->)",
                      rf"\g<1>{replacement}\g<2>",
                      content,
                      flags=re.DOTALL
                  )
                  
                  with open("README.md", "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print("Stats parsed and injected successfully.")
          except Exception as e:
              print(f"Error: {e}")
          '

      - name: Generate 3D Languages SVG Chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_chart.py

      - name: Unlock GitHub Sidebar Badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python unlock_badges.py

      - name: Commit and Push README changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md languages-3d.svg generate_chart.py unlock_badges.py
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update stats and unlock badges [skip ci]" && git push)

      - name: Push Snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
